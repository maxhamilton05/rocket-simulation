[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-sim"
version = "0.1.0"
description = "3DOF point-mass rocket trajectory simulator with variable-mass propulsion, atmospheric drag, gravity modeling, and numerical integration."
authors = [
    { name = "Max" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11"
]

[project.urls]
"Source" = "https://example.com/rocket-sim"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rocket_sim"]
